<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Jess - Quick Access</title>
  </head>
  <body>
    <section class="quick-access-section">
      <!-- Recently Accessed -->
      <section class="doc-box doc-box-recent">
        <div class="doc-box-subheader"></div>
        <div><!-- see all btn --></div>

        <div class="doc-item">
          <img />
          <div class="doc-item-title"></div>
          <div class="doc-item-desc"></div>
        </div>
      </section>

      <!-- Team Resources -->
      <section class="doc-box doc-box-resource">
        <div class="doc-box-subheader"></div>
        <div><!-- see all btn --></div>

        <div class="doc-item">
          <img />
          <div class="doc-item-title"></div>
          <div class="doc-item-desc"></div>
        </div>
      </section>

      <!-- Pinned Documents -->
      <section class="doc-box doc-box-pinned">
        <div class="doc-box-subheader"></div>
        <div class="doc-item-desc"><!-- see all btn --></div>

        <div class="doc-item">
          <img />
          <div class="doc-item-title"></div>
          <div class="doc-item-desc"></div>
        </div>
      </section>

      <!-- Company Policies -->
      <section class="doc-box doc-box-policy">
        <div class="doc-box-subheader"></div>
        <div><!-- see all btn --></div>

        <div class="doc-item">
          <img />
          <div class="doc-item-title"></div>
          <div class="doc-item-desc"></div>
        </div>
      </section>
    </section>
  </body>
</html>
