<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Components</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="c-tooltip">
        <button class="c-tooltip-close">
            <img  src="https://placecats.com/20/20" alt="tooltis-close-icon" >
        </button>
        <div class="c-tooltips-container">
            <div class="tooltip-step">
                <img src="https://placecats.com/100/100" alt="search-icon" class="tooltip-icon">
                <h3 class="tooltip-heading">Search</h3>
                <p class="tooltip-description">Find documents and resources using search and filters.</p>
            </div>

            <div class="tooltip-step">
                <img src="https://placecats.com/100/100" alt="sidebar-icon" class="tooltip-icon">
                <h3 class="tooltip-heading">Sidebar</h3>
                <p class="tooltip-description">Navigate easily between pages and available resources.</p>
            </div>

            <div class="tooltip-step">
                <img src="https://placecats.com/100/100" alt="QAcces-icon" class="tooltip-icon">
                <h3 class="tooltip-heading">Quick Access</h3>
                <p class="tooltip-description">Open frequently used documents and important links.</p>
            </div>

            <div class="tooltip-step">
                <img src="https://placecats.com/100/100" alt="News-icon" class="tooltip-icon">
                <h3 class="tooltip-heading">News Hub</h3>
                <p class="tooltip-description">Stay informed with company news and industry updates.</p>
            </div>
        </div>
    </div>
</body>
</html>
